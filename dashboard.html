<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzz6WaejEx1VoRkL-mk--rHJP5ldCWehBd9uaYddDX-4896d2bq6reQtISKBcY5R40Z/exec';

let globalSiswaData = [];

async function loadData() {
    try {
        const res = await fetch(API_URL);
        const json = await res.json();

        if (json.status !== "success" || !json.data) {
            throw new Error(json.message || "Data tidak ditemukan");
        }

        globalSiswaData = json.data;
        document.getElementById('header-status').textContent = `SMK DWI BHAKTI — BERHASIL MEMUAT ${globalSiswaData.length} DATA ✅`;

        // 1. Kalkulasi Statistik Utama
        const totalSiswa = globalSiswaData.length;
        const sudah = globalSiswaData.filter(s => s['DU/DI'] && s['DU/DI'] !== '').length;
        const belum = totalSiswa - sudah;

        const dudiSet = new Set();
        globalSiswaData.forEach(s => {
            if(s['DU/DI'] && s['DU/DI'] !== '') dudiSet.add(s['DU/DI'].toLowerCase());
        });

        document.getElementById('stat-total-siswa').textContent = totalSiswa;
        document.getElementById('stat-total-dudi').textContent = dudiSet.size;
        document.getElementById('stat-ditempatkan').textContent = sudah;
        document.getElementById('stat-belum-ditempatkan').textContent = belum;

        // 2. Distribusi Wilayah
        let cirebonTotal = 0, cirebonSudah = 0;
        let jatengTotal = 0, jatengSudah = 0;
        let jababekaTotal = 0, jababekaSudah = 0;

        globalSiswaData.forEach(s => {
            let wil = (s['WILAYAH'] || "").toLowerCase();
            let isPlaced = s['DU/DI'] && s['DU/DI'] !== '';

            if(wil.includes('cirebon')) {
                cirebonTotal++;
                if(isPlaced) cirebonSudah++;
            } else if(wil.includes('jawa') || wil.includes('jateng')) {
                jatengTotal++;
                if(isPlaced) jatengSudah++;
            } else if(wil.includes('jababeka') || wil.includes('bekasi') || wil.includes('cikarang')) {
                jababekaTotal++;
                if(isPlaced) jababekaSudah++;
            }
        });

        const maxS = totalSiswa || 1;
        document.getElementById('bar-cirebon-val').textContent = cirebonTotal;
        document.getElementById('bar-cirebon-rect').setAttribute('width', (cirebonTotal/maxS) * 380);

        document.getElementById('bar-jateng-val').textContent = jatengTotal;
        document.getElementById('bar-jateng-rect').setAttribute('width', (jatengTotal/maxS) * 380);

        document.getElementById('bar-jababeka-val').textContent = jababekaTotal;
        document.getElementById('bar-jababeka-rect').setAttribute('width', (jababekaTotal/maxS) * 380);

        updateDonut('cirebon', cirebonTotal, cirebonSudah);
        updateDonut('jateng', jatengTotal, jatengSudah);
        updateDonut('jababeka', jababekaTotal, jababekaSudah);

        setupSearch();

    } catch (e) {
        document.getElementById('header-status').textContent = "⚠️ Gagal mengambil data: " + e.message;
    }
}

function updateDonut(prefix, total, sudah) {
    document.getElementById(`donut-${prefix}-total`).textContent = total;
    document.getElementById(`txt-${prefix}-sudah`).textContent = `✅ Ditempatkan: ${sudah}`;
    document.getElementById(`txt-${prefix}-belum`).textContent = `⏳ Belum: ${total - sudah}`;
    
    let strokeDash = total === 0 ? 0 : (sudah / total) * 226;
    document.getElementById(`circle-${prefix}`).setAttribute('stroke-dasharray', `${strokeDash} 226`);
}

function setupSearch() {
    document.getElementById('search-siswa-input').addEventListener('input', (e) => {
        let kw = e.target.value.toLowerCase().trim();
        if(!kw) return;
        let s = globalSiswaData.find(item => item['SISWA'] && item['SISWA'].toLowerCase().includes(kw));
        if(s) {
            document.getElementById('res-siswa-nama').textContent = s['SISWA'].toUpperCase();
            document.getElementById('res-siswa-kelas').textContent = s['KELAS'] || '-';
            document.getElementById('res-siswa-dudi').textContent = s['DU/DI'] || '-';
            document.getElementById('res-siswa-pembimbing').textContent = s['PEMBIMBING'] || '-';
            
            let isP = s['DU/DI'] && s['DU/DI'].trim() !== '';
            document.getElementById('res-siswa-status').textContent = isP ? 'SUDAH DITEMPATKAN' : 'BELUM DITEMPATKAN';
            document.getElementById('res-siswa-status-box').setAttribute('fill', isP ? '#dcfce7' : '#ffedd5');
            document.getElementById('res-siswa-status').setAttribute('fill', isP ? '#15803d' : '#c2410c');
        } else {
            document.getElementById('res-siswa-nama').textContent = "Siswa tidak ditemukan";
            document.getElementById('res-siswa-status').textContent = "TIDAK DITEMUKAN";
            document.getElementById('res-siswa-status-box').setAttribute('fill', '#e2e8f0');
            document.getElementById('res-siswa-status').setAttribute('fill', '#64748b');
        }
    });

    document.getElementById('search-dudi-input').addEventListener('input', (e) => {
        let kw = e.target.value.toLowerCase().trim();
        if(!kw) return;
        let list = globalSiswaData.filter(item => item['DU/DI'] && item['DU/DI'].toLowerCase().includes(kw));
        if(list.length > 0) {
            document.getElementById('res-dudi-nama').textContent = list[0]['DU/DI'].toUpperCase();
            document.getElementById('res-dudi-count').textContent = `👥 ${list.length} Siswa PKL`;
            document.getElementById('res-dudi-wilayah').textContent = list[0]['WILAYAH'] || '-';
            document.getElementById('res-dudi-pic').textContent = list[0]['PEMBIMBING'] || '-';
            document.getElementById('res-dudi-siswa-list').innerHTML = list.map(x => `<span style="background:#ffffff; border:1px solid #bbf7d0; padding:2px 6px; border-radius:4px; margin-right:2px; margin-bottom:2px;">${x['SISWA']}</span>`).join('');
        } else {
            document.getElementById('res-dudi-nama').textContent = "Perusahaan tidak ditemukan";
            document.getElementById('res-dudi-count').textContent = `👥 0 Siswa PKL`;
            document.getElementById('res-dudi-siswa-list').innerHTML = `<span style="color:#64748b;">-</span>`;
        }
    });
}

window.onload = loadData;
</script>
